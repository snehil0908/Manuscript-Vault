<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — ManuscriptVault</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* Extra styles specific to login page */
        .auth-page::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 60px,
                    rgba(184,134,11,0.03) 60px,
                    rgba(184,134,11,0.03) 61px
                );
            pointer-events: none;
        }

        .divider-text {
            text-align: center;
            position: relative;
            margin: 1.25rem 0;
            color: #a89880;
            font-size: 0.8rem;
        }
        .divider-text::before, .divider-text::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: var(--border);
        }
        .divider-text::before { left: 0; }
        .divider-text::after  { right: 0; }
    </style>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <!-- Header -->
        <div class="auth-card-header">
            <div class="logo"></div>
            <h1>ManuscriptVault</h1>
            <p>Digital Manuscript Management System</p>
        </div>

        <!-- Body -->
        <div class="auth-card-body">
            <h3 style="margin-bottom:1.25rem; font-family:'Playfair Display',serif;">
                Sign In to Your Account
            </h3>

            <!-- Alert container -->
            <div id="alert-box"></div>

            <!-- Login Form -->
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div style="position:relative;">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                            style="padding-right:2.5rem;"
                        />
                        <button type="button" id="toggle-pw"
                            style="position:absolute;right:0.6rem;top:50%;transform:translateY(-50%);
                                   background:none;border:none;cursor:pointer;font-size:1rem;color:#a89880;">
                            
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" id="login-btn"
                        style="width:100%;margin-top:0.5rem;">
                    Sign In
                </button>
            </form>

            <div class="divider-text">or</div>

            <!-- Demo credentials hint -->
            <div class="alert alert-info" style="font-size:0.8rem;">
                <span>ℹ</span>
                <span>
                    <strong>Demo:</strong> admin / admin123 &nbsp;|&nbsp; john_doe / user123
                </span>
            </div>
        </div>

        <!-- Footer -->
        <div class="auth-footer">
            Don't have an account?
            <a href="signup.html">Create one here →</a>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    // Redirect if already logged in
    if (isLoggedIn()) {
        window.location.href = isAdmin() ? 'admin-dashboard.html' : 'user-dashboard.html';
    }

    // Toggle password visibility
    document.getElementById('toggle-pw').addEventListener('click', function() {
        const pwInput = document.getElementById('password');
        pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
        this.textContent = pwInput.type === 'password' ? ;
    });

    // Handle login form submission
    document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        clearAlert('alert-box');

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const btn      = document.getElementById('login-btn');

        // Client-side validation
        if (!username) { showAlert('alert-box', 'Please enter your username.'); return; }
        if (!password) { showAlert('alert-box', 'Please enter your password.'); return; }

        setButtonLoading(btn, true, 'Sign In');

        try {
            const data = await loginUser(username, password);

            // Save token and user info
            saveAuthData(data.token, data.username, data.role);

            showAlert('alert-box', `Welcome back, ${data.username}! Redirecting…`, 'success');

            // Redirect based on role
            setTimeout(() => {
                window.location.href = data.role === 'ADMIN'
                    ? 'admin-dashboard.html'
                    : 'user-dashboard.html';
            }, 800);

        } catch (err) {
            showAlert('alert-box', err.message || 'Invalid username or password.');
        } finally {
            setButtonLoading(btn, false, 'Sign In');
        }
    });
</script>
</body>
</html>
