<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — ManuscriptVault</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .auth-page::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                repeating-linear-gradient(
                    -45deg,
                    transparent,
                    transparent 60px,
                    rgba(139,26,26,0.025) 60px,
                    rgba(139,26,26,0.025) 61px
                );
            pointer-events: none;
        }

        .password-strength {
            height: 4px;
            border-radius: 2px;
            background: var(--parchment2);
            margin-top: 0.4rem;
            overflow: hidden;
        }
        .password-strength-bar {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s ease, background 0.3s ease;
            width: 0%;
        }
        .strength-label {
            font-size: 0.72rem;
            color: #a89880;
            margin-top: 0.2rem;
        }
    </style>
</head>
<body>
<div class="auth-page">
    <div class="auth-card" style="max-width:480px;">
        <!-- Header -->
        <div class="auth-card-header">
            <div class="logo"></div>
            <h1>ManuscriptVault</h1>
            <p>Create your account to get started</p>
        </div>

        <!-- Body -->
        <div class="auth-card-body">
            <h3 style="margin-bottom:1.25rem; font-family:'Playfair Display',serif;">
                Register New Account
            </h3>

            <!-- Alert container -->
            <div id="alert-box"></div>

            <!-- Signup Form -->
            <form id="signup-form" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username (min 3 chars)"
                        autocomplete="username"
                        minlength="3"
                        maxlength="50"
                        required
                    />
                    <small id="username-hint" style="color:#a89880;font-size:0.75rem;"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div style="position:relative;">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Choose a strong password (min 6 chars)"
                            autocomplete="new-password"
                            minlength="6"
                            required
                            style="padding-right:2.5rem;"
                        />
                        <button type="button" id="toggle-pw"
                            style="position:absolute;right:0.6rem;top:50%;transform:translateY(-50%);
                                   background:none;border:none;cursor:pointer;font-size:1rem;color:#a89880;">
                            
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strength-bar"></div>
                    </div>
                    <div class="strength-label" id="strength-label"></div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="role">Account Role</label>
                    <select id="role" name="role" required>
                        <option value="">— Select a role —</option>
                        <option value="USER">User — Browse & search manuscripts</option>
                        <option value="ADMIN">Admin — Full management access</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" id="signup-btn"
                        style="width:100%;margin-top:0.5rem;">
                    Create Account
                </button>
            </form>
        </div>

        <!-- Footer -->
        <div class="auth-footer">
            Already have an account?
            <a href="login.html">Sign in here →</a>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    // Redirect if already logged in
    if (isLoggedIn()) {
        window.location.href = isAdmin() ? 'admin-dashboard.html' : 'user-dashboard.html';
    }

    // Toggle password visibility
    document.getElementById('toggle-pw').addEventListener('click', function() {
        const pwInput = document.getElementById('password');
        pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
        // this.textContent = pwInput.type === 'password' ?;
    });

    // Username live validation
    document.getElementById('username').addEventListener('input', function() {
        const hint = document.getElementById('username-hint');
        const val = this.value.trim();
        if (val.length > 0 && val.length < 3) {
            hint.textContent = '⚠ Username must be at least 3 characters';
            hint.style.color = 'var(--crimson)';
        } else if (val.length >= 3) {
            hint.textContent = '✓ Looks good!';
            hint.style.color = 'var(--sage)';
        } else {
            hint.textContent = '';
        }
    });

    // Password strength meter
    document.getElementById('password').addEventListener('input', function() {
        const val = this.value;
        const bar = document.getElementById('strength-bar');
        const label = document.getElementById('strength-label');
        let strength = 0;

        if (val.length >= 6)  strength++;
        if (val.length >= 10) strength++;
        if (/[A-Z]/.test(val) && /[a-z]/.test(val)) strength++;
        if (/[0-9]/.test(val))  strength++;
        if (/[^A-Za-z0-9]/.test(val)) strength++;

        const levels = [
            { pct: '0%',   color: 'transparent', text: '' },
            { pct: '25%',  color: '#e04040',      text: 'Weak' },
            { pct: '50%',  color: '#e07030',      text: 'Fair' },
            { pct: '75%',  color: '#d4a017',      text: 'Good' },
            { pct: '100%', color: 'var(--sage)',   text: 'Strong' },
        ];

        const s = levels[Math.min(strength, 4)];
        bar.style.width = s.pct;
        bar.style.background = s.color;
        label.textContent = s.text ? `Password strength: ${s.text}` : '';
    });

    // Handle signup form submission
    document.getElementById('signup-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        clearAlert('alert-box');

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const confirm  = document.getElementById('confirm-password').value;
        const role     = document.getElementById('role').value;
        const btn      = document.getElementById('signup-btn');

        // Client-side validation
        if (!username || username.length < 3) {
            showAlert('alert-box', 'Username must be at least 3 characters.'); return;
        }
        if (!password || password.length < 6) {
            showAlert('alert-box', 'Password must be at least 6 characters.'); return;
        }
        if (password !== confirm) {
            showAlert('alert-box', 'Passwords do not match. Please try again.'); return;
        }
        if (!role) {
            showAlert('alert-box', 'Please select a role.'); return;
        }

        setButtonLoading(btn, true, 'Create Account');

        try {
            await signupUser(username, password, role);

            showAlert('alert-box', 'Account created successfully! Redirecting to login…', 'success');

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);

        } catch (err) {
            showAlert('alert-box', err.message || 'Registration failed. Please try again.');
        } finally {
            setButtonLoading(btn, false, 'Create Account');
        }
    });
</script>
</body>
</html>
