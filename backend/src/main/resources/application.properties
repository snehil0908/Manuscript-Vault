# ==============================
# ManuscriptVault - Application Configuration
# ==============================

# Server Port
server.port=8081

# ==============================
# MySQL Database Configuration
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/manuscript_vault?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate Configuration
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# JWT Configuration
# ==============================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==============================
# Logging
# ==============================
logging.level.com.manuscriptvault=DEBUG
logging.level.org.springframework.security=DEBUG

# ==============================
# CORS (allow frontend at any port during dev)
# ==============================
spring.web.cors.allowed-origins=*